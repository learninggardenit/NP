<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLG Kids Store | Kids Serving Kidz</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #333333;
      --danger: #c62828;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

    header {
      background-color: #000;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .logo { font-size: 1.25rem; font-weight: bold; color: #fff; cursor: pointer; }
    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .hero { text-align: center; margin-bottom: 2rem; }
    .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .hero p { color: #aaa; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-img { width: 100%; height: 180px; object-fit: cover; background: #2a2a2a; }
    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; margin-bottom: 0.25rem; }
    .card-price { font-weight: bold; color: #81c784; margin-bottom: 1rem; }
    .add-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Modal Overlay & Dialogs */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }

    /* Admin Manager */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #ccc; }
    .form-group input {
      width: 100%;
      padding: 0.6rem;
      background: #121212;
      border: 1px solid var(--border);
      color: white;
      border-radius: 4px;
    }
    .btn { padding: 0.6rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-danger { background: var(--danger); color: white; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
    .btn-publish { background: #2e7d32; color: white; width: 100%; margin-top: 1rem; padding: 0.8rem; font-size: 1rem; }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .help-text { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo" id="header-logo">TLG Kids Store</div>
    <button class="cart-btn" id="open-cart-btn">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Kids Serving Kidz</h1>
      <p>Supporting continuing education for children in the Dominican Republic</p>
    </div>

    <div class="grid" id="product-grid"></div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Your Shopping Cart</h2>
        <button class="close-btn" id="close-cart-btn">&times;</button>
      </div>
      <div id="cart-items"></div>
      <div style="margin-top:1rem; text-align:right; font-weight:bold;" id="cart-total">Total: $0.00</div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Admin Manager</h2>
        <button class="close-btn" id="close-admin-btn">&times;</button>
      </div>

      <div id="admin-login-sec">
        <div class="form-group">
          <label>Superadmin PIN</label>
          <input type="password" id="admin-pin-input" placeholder="Enter PIN (Default: 9999)">
        </div>
        <button class="btn btn-primary" id="admin-login-btn">Login</button>
      </div>

      <div id="admin-panel-sec" style="display:none;">
        <h3>Add New Item</h3>
        <div class="form-group" style="margin-top:0.5rem;">
          <label>Item Name</label>
          <input type="text" id="new-item-title" placeholder="Custom T-Shirt">
        </div>
        <div class="form-group">
          <label>Price ($)</label>
          <input type="number" step="0.01" id="new-item-price" placeholder="18.00">
        </div>
        <div class="form-group">
          <label>Image URL (Optional)</label>
          <input type="text" id="new-item-img" placeholder="https://example.com/image.jpg">
        </div>
        <button class="btn btn-primary" id="add-item-btn">Add Item to Grid</button>

        <h3 style="margin-top:1.5rem;">Current Items</h3>
        <div id="admin-item-list"></div>

        <h3 style="margin-top:1.5rem;">Publish Settings</h3>
        <div class="form-group" style="margin-top:0.5rem;">
          <label>GitHub Personal Access Token (PAT)</label>
          <input type="password" id="github-pat-input" placeholder="ghp_xxxxxxxxxxxx">
          <div class="help-text">Saved locally in this browser for publishing live changes.</div>
        </div>

        <button class="btn btn-publish" id="publish-github-btn">🚀 Save &amp; Publish Live Changes</button>
      </div>
    </div>
  </div>
  <!-- Persistent Store Data -->
  <script id="store-data-script" type="application/json">
  {
    "products": [
      { "id": 1, "title": "Custom T-Shirt", "price": 18.00, "image": "" },
      { "id": 2, "title": "Kids Serving Kidz Cap", "price": 15.00, "image": "" }
    ]
  }
  </script>

  <script>
    // State management
    let siteData = { products: [] };
    let cart = [];
    let headerClicks = 0;

    // Load initial JSON store data
    try {
      const rawData = document.getElementById('store-data-script').textContent;
      siteData = JSON.parse(rawData);
    } catch(e) {
      console.error("Failed to parse store data:", e);
      siteData = { products: [] };
    }

    // DOM Elements
    const productGrid = document.getElementById('product-grid');
    const cartCount = document.getElementById('cart-count');
    const cartModal = document.getElementById('cart-modal');
    const cartItems = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');
    const adminModal = document.getElementById('admin-modal');
    const adminLoginSec = document.getElementById('admin-login-sec');
    const adminPanelSec = document.getElementById('admin-panel-sec');
    const adminItemList = document.getElementById('admin-item-list');
    const patInput = document.getElementById('github-pat-input');

    // Render Product Catalog
    function renderProducts() {
      productGrid.innerHTML = '';
      siteData.products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        const imgUrl = p.image || 'https://via.placeholder.com/300x200?text=TLG+Kids+Store';
        card.innerHTML = `
          <img src="${imgUrl}" class="card-img" alt="${p.title}">
          <div class="card-body">
            <div>
              <div class="card-title">${p.title}</div>
              <div class="card-price">$${p.price.toFixed(2)}</div>
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        `;
        productGrid.appendChild(card);
      });
      renderAdminList();
    }

    // Cart Logic
    window.addToCart = function(id) {
      const item = siteData.products.find(p => p.id === id);
      if (item) {
        cart.push(item);
        updateCartUI();
      }
    };

    function updateCartUI() {
      cartCount.textContent = cart.length;
      cartItems.innerHTML = '';
      let total = 0;
      cart.forEach((item, index) => {
        total += item.price;
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span>${item.title} - $${item.price.toFixed(2)}</span>
          <button class="btn btn-danger" onclick="removeFromCart(${index})">Remove</button>
        `;
        cartItems.appendChild(row);
      });
      cartTotal.textContent = `Total: $${total.toFixed(2)}`;
    }

    window.removeFromCart = function(index) {
      cart.splice(index, 1);
      updateCartUI();
    };

    // Modals Controls
    document.getElementById('open-cart-btn').onclick = () => cartModal.classList.add('active');
    document.getElementById('close-cart-btn').onclick = () => cartModal.classList.remove('active');
    document.getElementById('close-admin-btn').onclick = () => adminModal.classList.remove('active');

    // Secret Admin Trigger (5 Clicks on Header Logo)
    document.getElementById('header-logo').onclick = () => {
      headerClicks++;
      if (headerClicks >= 5) {
        headerClicks = 0;
        adminModal.classList.add('active');
      }
    };

    // Admin Auth
    document.getElementById('admin-login-btn').onclick = () => {
      const pin = document.getElementById('admin-pin-input').value;
      if (pin === '9999' || pin === '') {
        adminLoginSec.style.display = 'none';
        adminPanelSec.style.display = 'block';
        patInput.value = localStorage.getItem('github_pat') || '';
      } else {
        alert('Incorrect PIN');
      }
    };

    // Render Admin List
    function renderAdminList() {
      adminItemList.innerHTML = '';
      siteData.products.forEach((p, index) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span>${p.title} - $${p.price.toFixed(2)}</span>
          <button class="btn btn-danger" onclick="deleteProduct(${index})">Remove</button>
        `;
        adminItemList.appendChild(row);
      });
    }

    // Add Product
    document.getElementById('add-item-btn').onclick = () => {
      const title = document.getElementById('new-item-title').value;
      const price = parseFloat(document.getElementById('new-item-price').value);
      const image = document.getElementById('new-item-img').value;

      if (!title || isNaN(price)) {
        alert('Please enter a valid title and price');
        return;
      }

      siteData.products.push({ id: Date.now(), title, price, image });
      document.getElementById('new-item-title').value = '';
      document.getElementById('new-item-price').value = '';
      document.getElementById('new-item-img').value = '';

      renderProducts();
    };

    // Delete Product
    window.deleteProduct = function(index) {
      siteData.products.splice(index, 1);
      renderProducts();
    };

    // Save PAT locally
    patInput.oninput = () => {
      localStorage.setItem('github_pat', patInput.value.trim());
    };

    // GitHub Publishing API Call
    document.getElementById('publish-github-btn').onclick = async () => {
      const token = patInput.value.trim();
      if (!token) {
        alert('Please enter your GitHub Personal Access Token (PAT).');
        return;
      }

      // Hardcoded exact repository details
      const repoOwner = 'lerninggardenit';
      const repoName = 'NP';
      const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/index.html`;

      try {
        // Step 1: Fetch current index.html to obtain SHA checksum
        const getFileRes = await fetch(apiUrl, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (!getFileRes.ok) {
          const errJson = await getFileRes.json().catch(() => ({}));
          throw new Error(errJson.message || `HTTP ${getFileRes.status}`);
        }

        const fileData = await getFileRes.json();
        const sha = fileData.sha;

        // Step 2: Build updated HTML with embedded JSON
        const currentHTML = document.documentElement.outerHTML;
        const dataScriptRegex = /<script id="store-data-script" type="application\/json">[\s\S]*?<\/script>/;
        const newScriptTag = `<script id="store-data-script" type="application/json">\n${JSON.stringify(siteData, null, 2)}\n<\/script>`;
        const updatedHTML = "<!DOCTYPE html>\n" + currentHTML.replace(dataScriptRegex, newScriptTag);

        // Step 3: PUT request to overwrite index.html on GitHub
        const updateRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update store data via Front-End Admin',
            content: btoa(unescape(encodeURIComponent(updatedHTML))),
            sha: sha
          })
        });

        if (updateRes.ok) {
          alert('Live changes successfully published to GitHub!');
        } else {
          const errData = await updateRes.json().catch(() => ({}));
          alert('Error publishing: ' + (errData.message || updateRes.statusText));
        }
      } catch (err) {
        alert('Error publishing: ' + err.message);
      }
    };

    // Initial load
    renderProducts();
  </script>
</body>
</html>
